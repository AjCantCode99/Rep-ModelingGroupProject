<html>
    <head>
        <link rel="stylesheet" href="HawaiiCSS.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
        <meta name="viewport" content="width=device-width, intitial-scale=2.0">
    </head>

    <style>
        .material-symbols-outlined {
        font-size: 40px;
        font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 40
        }
    </style>

    <script>
        function myFunction(x) {
            x.classList.toggle("change");
            document.getElementById("menu").classList.toggle("open");
        }
    </script>

    <body>
<!--      <span class="material-symbols-outlined button" onclick="ShowNav()">menu</span>!-->
        <div class="container" onclick="myFunction(this)">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </div>
        <ul id="menu">
            <li><a>Home</a></li>
            <li><a>New York</a></li>
            <li><a>Hawaii</a></li>
            <li><a>Texas</a></li>
            <li><a>Other</a></li>
        </ul>
    </body>
</html>
